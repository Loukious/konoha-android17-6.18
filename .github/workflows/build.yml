name: Build Android 17 6.18 GKI and Onyx modules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Include the opt-in AMBA/QDSS diagnostic build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      kernel_revision: ${{ steps.export.outputs.kernel_revision }}
      kernelsu_revision: ${{ steps.export.outputs.kernelsu_revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate automation
        run: python3 -m unittest discover -s ci/tests -v
      - name: Prepare standard hosted runner
        run: bash ci/bootstrap_runner.sh
      - name: Sync locked kernel and vendor sources
        run: python3 port/prepare.py "$RUNNER_TEMP/konoha-workspace" --jobs 4
      - name: Replay all module patches and verify committed source snapshot
        run: |
          python3 port/stage.py "$RUNNER_TEMP/konoha-workspace"
          python3 ci/snapshot.py "$RUNNER_TEMP/konoha-workspace/onyx"
      - name: Verify CoreSight lifecycle correction
        run: python3 port/validation/clock_suspend_resume/verify_platform_remove.py "$RUNNER_TEMP/konoha-workspace"
      - name: Build matching GKI and every ported module with latest KernelSU Next dev
        env:
          DIAGNOSTIC: ${{ inputs.diagnostic || false }}
        run: |
          flags=()
          if [[ "$DIAGNOSTIC" == true ]]; then flags+=(--qdss-diagnostic); fi
          python3 port/build.py "$RUNNER_TEMP/konoha-workspace" \
            --jobs "$KONOHA_BUILD_JOBS" --memory-mb "$KONOHA_BUILD_MEMORY_MB" "${flags[@]}"
      - name: Verify and export modules, kernel and ABI
        id: export
        run: python3 ci/export_artifacts.py "$RUNNER_TEMP/konoha-workspace" artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Konoha-Android17-6.18-${{ github.run_number }}
          path: artifacts/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/konoha-workspace/artifacts/*/build.log
            ${{ runner.temp }}/konoha-workspace/artifacts/*/common-fixes/receipt.json
            port/validation/clock_suspend_resume/platform-remove-validation.json
          retention-days: 7
          if-no-files-found: warn

  record:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.diagnostic != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record verified main-branch revisions
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_REVISION: ${{ needs.build.outputs.kernel_revision }}
          KERNELSU_REVISION: ${{ needs.build.outputs.kernelsu_revision }}
        run: python3 ci/record_success.py "$KERNEL_REVISION" "$KERNELSU_REVISION"
